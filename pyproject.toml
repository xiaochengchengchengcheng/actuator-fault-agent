[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "actuator-fault-agent"
version = "0.1.0"
description = "Evidence-grounded fault diagnosis agent for electromechanical actuator production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.119,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.2.12,<2.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
  "uvicorn[standard]>=0.37,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.14,<1.0",
]
production = [
  "langgraph-checkpoint-postgres>=2.0,<5.0",
  "psycopg[binary,pool]>=3.2,<4.0",
]

[project.scripts]
actuator-agent = "actuator_fault_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/actuator_fault_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

